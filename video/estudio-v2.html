<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estúdio v2 · plano-sequência</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@200;300;600;800&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root { --bg: #02060d; --text: #dcecff; --dim: #5f86ad; --cyan: #4fe3ff; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px -apple-system, "Segoe UI", sans-serif; }
  .wrap { display: flex; gap: 20px; padding: 16px; align-items: flex-start; flex-wrap: wrap; }
  canvas { height: calc(100vh - 32px); max-width: 100%; aspect-ratio: 9 / 16; border: 1px solid #17406a; border-radius: 8px; background: #000; }
  .side { max-width: 340px; }
  button { background: var(--cyan); color: var(--bg); border: 0; border-radius: 6px; padding: 12px 16px; font: 700 12px ui-monospace, Menlo, monospace; letter-spacing: .14em; cursor: pointer; margin: 0 8px 8px 0; }
  button.sec { background: none; color: var(--cyan); border: 1px solid var(--cyan); }

  input[type=range] { width: 100%; }
</style>
</head>
<body>
<div class="wrap">
  <canvas id="c" width="1080" height="1920"></canvas>
  <div class="side">
    <h2 style="margin:0 0 8px;font-weight:300">Estúdio v2 · plano-sequência</h2>
    <p style="color:var(--dim);margin:0 0 12px">Câmera 3D contínua, morphing de partículas, tipografia cinética, trilha original a 104 BPM e efeitos no mapa de áudio.</p>
    <button id="exp">EXPORTAR VÍDEO</button><button id="prev" class="sec">PRÉVIA</button>
    <input id="scrub" type="range" min="0" max="1000" value="60" title="Ver um quadro do vídeo">
    <div id="st">Carregando…</div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/build/mp4-muxer.js"></script>
<script>
/* ============================================================
   Estúdio v2 — direção criativa aplicada (tudo original: formas, tipografia, trilha e efeitos)
   ============================================================ */
const C = document.getElementById('c'), g = C.getContext('2d'), W = 1080, H = 1920, CX = W / 2, CY = H / 2;
const st = (m) => { document.getElementById('st').textContent = m; };
const SCENES = [
  { tag: '', title: 'COMO FUNCIONA UM ASSISTENTE PESSOAL COM IA', text: 'Olá, senhor Wash. Eu sou o Jarvis, o seu assistente pessoal. Vou mostrar como eu funciono e tudo o que eu sei fazer.' },
  { tag: '1 · ESCUTA', title: 'Ele escuta', text: 'Eu escuto. Quando ele diz Jarvis, o microfone transforma a fala em texto, em menos de um segundo.' },
  { tag: '2 · ENTENDE', title: 'Ele entende', text: 'Eu identifico o pedido. Pode ser abrir um programa, anotar uma tarefa ou consultar o mercado.' },
  { tag: '3 · BUSCA', title: 'Dados reais', text: 'Passo três: eu busco os dados. Cotações, clima, notícias do setor e a minha memória, sempre com fonte. Eu não invento números.' },
  { tag: '3 · FALA', title: 'Responde com voz', text: 'Eu respondo com voz. O texto vira fala no próprio computador, sem mandar a voz para a nuvem.' },
  { tag: '4 · SEGURANÇA', title: 'Só com permissão', text: 'Eu peço permissão. Enviar, apagar ou comprar, só com a aprovação dele.' },
  { tag: '5 · AÇÃO', title: 'Faz por você', text: 'E eu faço muito mais: agendo mensagens, envio e-mails, abro programas, leio a tela, guardo lembretes e preparo o resumo do dia às sete da manhã. Tudo com a sua aprovação.' },
  { tag: '6 · CONVERSA', title: 'Conversa de verdade', text: 'Você conversa comigo como com uma pessoa. Me conte o problema: eu analiso a situação, comparo as opções e sugiro o próximo passo.' },
  { tag: '7 · MERCADO', title: 'Ações e cripto', text: 'E eu acompanho o mercado ao vivo: ações, petróleo, Bitcoin e Ethereum. Eu analiso o cenário e explico os riscos, mas a decisão de investir é sempre sua.' },
  { tag: '', title: 'JARVIS', text: 'Quer um assistente assim? Comente Jarvis que eu explico.' },
];
const FIN = SCENES.length - 1, STEPS = FIN - 1;
// versão de 1 minuto: a cena 'Dados reais' sai (o mercado aparece na cena 8) e as falas dos passos perderam o 'Passo X:'
const SKIP = new Set([3]);
const CUT = { 1: 1.00, 2: 2.03, 4: 1.17, 5: 1.01 };   // segundos tirados do início da fala: o conteúdo visual continua no ritmo da voz
const nextS = (i) => { let j = i + 1; while (SKIP.has(j)) j++; return j; };
const prevS = (i) => { let j = i - 1; while (j > 0 && SKIP.has(j)) j--; return Math.max(0, j); };
const SHOWN = SCENES.map((_, i) => i).filter((i) => !SKIP.has(i)), STEPLIST = SHOWN.filter((i) => i >= 1 && i <= STEPS);
const TAGCOL = { 5: '#ffb547', 8: '#3ee6a2' };
// transição que leva a cada cena: mergulho (through), chicote lateral (whip) ou giro (spin)
const TRANS = { 1: 'through', 2: 'whip', 3: 'spin', 4: 'through', 5: 'whip', 6: 'spin', 7: 'whip', 8: 'spin', 9: 'through' };
const GAP = 0.3, TAIL = 1.2, FPS = 30, SR = 48000;
let buffers = [], starts = [], total = 0, market = [], MIX = null, ENV = null;

/* ---------- utilidades ---------- */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const eIO = (x) => { x = clamp(x); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };

const sceneAt = (T) => { let si = 0; for (let i = 0; i < starts.length; i++) if (T >= (i ? starts[i] - GAP / 2 : 0)) si = i; return si; };
const sceneBegin = (i) => (i ? starts[i] - GAP / 2 : 0);
const kw = (si, word) => { const tx = SCENES[si].text, i = tx.indexOf(word); return (i < 0 ? 0 : i / tx.length) * (buffers[si]?.duration || 3) + GAP / 2; };

/* ---------- câmera 3D virtual (orbit + dolly + lente + roll) ---------- */
const cam = { tx: 0, ty: 0, tz: 0, dist: 1200, yaw: 0, pitch: 0, roll: 0, f: 900, focus: 1200 };
function project(x, y, z) {
  x -= cam.tx; y -= cam.ty; z -= cam.tz;
  const cy = Math.cos(cam.yaw), sy = Math.sin(cam.yaw), cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
  const x1 = x * cy - z * sy, z1 = x * sy + z * cy;
  const y2 = y * cp - z1 * sp, z2 = y * sp + z1 * cp + cam.dist;

  const k = cam.f / z2;
  return [x1 * k, y2 * k, z2, k];
}
const lensF = (mm) => mm * 31; // 24 mm ≈ 744 px, 85 mm ≈ 2635 px
function setCamera(si, lt, dur) {
  const deg = Math.PI / 180;
  cam.tx = cam.ty = cam.tz = 0; cam.roll = 0;
  if (si === 0) {            // crane-out + orbit 20° esq · 85 mm → 35 mm
    const k = eIO((lt - 0.7) / 3.0);
    cam.dist = lerp(380, 1350, k); cam.pitch = lerp(0, -10, k) * deg; cam.yaw = lerp(0, -20, k) * deg; cam.f = lensF(lerp(85, 35, k));
  } else if (si === 1) {     // tracking lateral para a direita · 24 mm · tilt -5°
    const k = clamp(lt / dur);
    cam.tx = lerp(-260, 260, k); cam.dist = 1150; cam.pitch = -5 * deg; cam.yaw = lerp(6, -6, k) * deg; cam.f = lensF(26);
  } else if (si === 2) {     // orbit 35° + push-in
    const k = eIO(lt / dur);
    cam.yaw = lerp(-20, 15, k) * deg; cam.dist = lerp(1350, 1000, k); cam.pitch = -6 * deg; cam.f = lensF(30);
  } else if (si === 3) {     // crane descendo 15° + push-in com ease-out
    const k = eOut(lt / 2.2);
    cam.pitch = lerp(15, 2, k) * deg; cam.dist = lerp(1500, 1080, k); cam.yaw = lerp(-8, 0, k) * deg; cam.f = lensF(32);
  } else if (si === 4) {     // FPV pela linha do tempo, depois orbit no equalizador
    const k = clamp(lt / 4.4);
    cam.tz = lerp(lerp(-650, 650, eIO(k)), 0, eIO((lt - 4.2) / 1.4)); cam.dist = lerp(520, 1050, eIO((lt - 4.2) / 1.6)); cam.f = lensF(24);
    cam.roll = Math.sin(lt * 1.6) * 8 * deg * (1 - eIO((lt - 4.2) / 1.2)); cam.yaw = lerp(0, 25, eIO((lt - 4.4) / 2)) * deg; cam.pitch = -4 * deg;
  } else if (si === 5) {     // push-in dramático + dutch 3° que endireita no clique
    const k = eIn(lt / dur);
    cam.dist = lerp(1400, 980, k); cam.roll = lerp(3, 0, eOut((lt - 2.5) / 0.4)) * deg; cam.f = lensF(40);
  } else if (si === 6) {     // carrossel: câmera desce em grua e aproxima, leve órbita
    const k = eIO(lt / dur);
    cam.pitch = lerp(-18, -6, k) * deg; cam.dist = lerp(1500, 1150, k); cam.yaw = lerp(8, -8, k) * deg; cam.f = lensF(30);
  } else if (si === 7) {     // conversa: dolly lento com dutch sutil
    const k = eIO(lt / dur);
    cam.dist = lerp(1300, 1050, k); cam.yaw = lerp(-14, 10, k) * deg; cam.pitch = -4 * deg; cam.roll = Math.sin(lt * 0.9) * 1.5 * deg; cam.f = lensF(28);
  } else if (si === 8) {     // mercado: órbita de 50° em volta dos candles + grua subindo
    const k = eIO(lt / dur);
    cam.yaw = lerp(-30, 20, k) * deg; cam.pitch = lerp(-2, -16, k) * deg; cam.dist = lerp(1250, 1050, k); cam.f = lensF(26);
  } else {                   // espiral: orbit 180° + push-in + tilt, termina frontal e parada
    const k = eIO(lt / 2.6);
    cam.yaw = lerp(180, 0, k) * deg; cam.dist = lerp(1900, 1150, k); cam.pitch = lerp(10, 0, k) * deg; cam.f = lensF(lerp(24, 35, k));
  }
  cam.focus = cam.dist;
}

/* ---------- campo de estrelas, névoa e feixes ---------- */
const STARS = Array.from({ length: 360 }, () => ({ x: (rnd() - 0.5) * 3600, y: (rnd() - 0.5) * 5600, z: rnd() * 2600 + 80 }));
function stars(T, warp) {
  g.save(); g.translate(CX, CY);
  for (const s of STARS) {
    const z = ((s.z - T * (160 + warp * 2400)) % 2600 + 2600) % 2600 + 60;
    const k = 760 / z, x = s.x * k, y = s.y * k;
    if (Math.abs(x) > CX + 40 || Math.abs(y) > CY + 40) continue;
    const near = 1 - z / 2660, a = 0.12 + near * 0.8;
    if (warp > 0.08) { const k0 = 760 / (z + 80 * warp); g.strokeStyle = `rgba(130,205,255,${a})`; g.lineWidth = 1 + near * 2; g.beginPath(); g.moveTo(s.x * k0, s.y * k0); g.lineTo(x, y); g.stroke(); }
    else { g.fillStyle = `rgba(160,215,255,${a})`; g.fillRect(x, y, 1 + near * 2.5, 1 + near * 2.5); }
  }
  g.restore();
}
function fog(T, color, strength) {
  for (let i = 0; i < 3; i++) {
    const x = CX + Math.sin(T * 0.13 + i * 2.1) * 260, y = CY + Math.cos(T * 0.11 + i * 1.7) * 420, r = 700 + i * 160;
    const gr = g.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, `rgba(${color},${0.07 * strength})`); gr.addColorStop(1, `rgba(${color},0)`);
    g.fillStyle = gr; g.fillRect(0, 0, W, H);
  }
}
function shafts(x, y, T, strength, color = '79,227,255') {
  g.save(); g.translate(x, y); g.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 7; i++) {
    const a = T * 0.08 + i * (Math.PI * 2 / 7), w = 0.07 + 0.03 * Math.sin(T + i);
    const gr = g.createRadialGradient(0, 0, 40, 0, 0, 1300);
    gr.addColorStop(0, `rgba(${color},${0.10 * strength})`); gr.addColorStop(1, `rgba(${color},0)`);
    g.fillStyle = gr; g.beginPath(); g.moveTo(0, 0); g.arc(0, 0, 1300, a - w, a + w); g.closePath(); g.fill();
  }
  g.restore();
}

/* ---------- nuvem de partículas com morphing entre formas ---------- */
const N = 1000;
const P = Array.from({ length: N }, (_, i) => ({ d: rnd(), sw: rnd() * Math.PI * 2, r: rnd() }));
function textPoints(str, size, maxW, yOff = 0, weight = 800) {
  const oc = document.createElement('canvas'); oc.width = 1400; oc.height = 600; const o = oc.getContext('2d');
  o.font = `${weight} ${size}px "Sora", -apple-system, sans-serif`; o.fillStyle = '#fff'; o.textAlign = 'center'; o.textBaseline = 'middle';
  const lines = str.split('\n'); lines.forEach((l, i) => o.fillText(l, 700, 300 + (i - (lines.length - 1) / 2) * size * 1.1, maxW));
  const d = o.getImageData(0, 0, 1400, 600).data, pts = [];
  for (let y = 0; y < 600; y += 4) for (let x = 0; x < 1400; x += 4) if (d[(y * 1400 + x) * 4 + 3] > 128) pts.push([x - 700, y - 300 + yOff, 0]);
  const out = []; for (let i = 0; i < N; i++) out.push(pts[Math.floor((i / N) * pts.length + rnd() * 3) % pts.length] || [0, 0, 0]);
  return out;
}
function perimeter(cx, cy, cz, w, h, i, n) { // contorno de retângulo arredondado
  const t = (i / n) * 2 * (w + h); let x, y;
  if (t < w) { x = -w / 2 + t; y = -h / 2; } else if (t < w + h) { x = w / 2; y = -h / 2 + (t - w); } else if (t < 2 * w + h) { x = w / 2 - (t - w - h); y = h / 2; } else { x = -w / 2; y = h / 2 - (t - 2 * w - h); }
  return [cx + x, cy + y, cz];
}
let TXT1, TXTJ, CANDLES = [];
const NODES = [], EDGES = [];   // rede neural: 4 camadas de nós
[[4, -360], [6, -120], [6, 120], [3, 360]].forEach(([n, x], L) => { for (let k = 0; k < n; k++) NODES.push([x, -230 + (k - (n - 1) / 2) * 92, ((k % 2) - 0.5) * 140, L]); });
NODES.forEach((A, a) => NODES.forEach((B, b) => { if (B[3] === A[3] + 1) EDGES.push([a, b]); }));
function shapeAt(si, i, lt, lvl) {
  const p = P[i];
  if (si === 0) {      // núcleo: esfera de Fibonacci respirando
    const k = i + 0.5, phi = Math.acos(1 - 2 * k / N), th = Math.PI * (1 + Math.sqrt(5)) * k + lt * 0.5;
    const r = 250 * (1 + 0.06 * Math.sin(lt * 2 + i) + lvl * 0.25);
    return [r * Math.sin(phi) * Math.cos(th), r * Math.cos(phi), r * Math.sin(phi) * Math.sin(th)];
  }
  if (si === 1) {      // onda sonora → frase falada
    const x = -520 + 1040 * (i / N), wave = [x, Math.sin(x * 0.018 + lt * 5) * (40 + 120 * lvl) * Math.sin((i / N) * Math.PI) + 120, ((i % 9) - 4) * 10];
    const m = eIO((lt - 2.5) / 1.0); if (m <= 0) return wave;
    const t = TXT1[i]; return [lerp(wave[0], t[0], m), lerp(wave[1], t[1] + 120, m), lerp(wave[2], t[2], m)];
  }
  if (si === 2) {      // três chips em profundidades diferentes
    const c = i % 3, n = Math.floor(N / 3);
    return perimeter(0, -210 + c * 210, 160 - c * 160, 760, 130, Math.floor(i / 3), n);
  }
  if (si === 3) {      // três gráficos de linha (cotações reais)
    const row = i % 3, q = market[row] || { spark: [] }, s = q.spark && q.spark.length > 1 ? q.spark : [1, 2, 1.5, 2.5, 2, 3];
    const u = (Math.floor(i / 3) / (N / 3)), idx = u * (s.length - 1), a = Math.floor(idx), b = Math.min(s.length - 1, a + 1);
    const mn = Math.min(...s), mx = Math.max(...s), v = lerp(s[a], s[b], idx - a), y = (1 - (v - mn) / (mx - mn || 1)) * 110;
    const draw = eOut((lt - row * 0.35) / 1.2);
    return [lerp(-360, 360, u) * draw, -330 + row * 165 + y - 55, -40 + row * 40];
  }
  if (si === 4) {      // linha do tempo em profundidade → equalizador circular
    const tl = [Math.sin(i * 0.7) * 6, 80 + Math.cos(i * 0.9) * 6, lerp(-700, 700, i / N)];
    const m = eIO((lt - 4.3) / 1.1); if (m <= 0) return tl;
    const a = (i / N) * Math.PI * 2, bar = 1 + lvl * 0.6 * Math.abs(Math.sin(a * 8 + lt * 6)), r = 240 * bar * (0.85 + 0.15 * p.r);
    return [lerp(tl[0], Math.cos(a) * r, m), lerp(tl[1], Math.sin(a) * r - 170, m), lerp(tl[2], 0, m)];
  }
  if (si === 5) {      // cadeado: corpo + arco que abre depois do clique
    const open = eBack((lt - 2.7) / 0.6);
    if (i < N * 0.42) { const a = Math.PI * (i / (N * 0.42)); return [Math.cos(a) * 118, -268 - Math.sin(a) * 132 - open * 60, 0]; }
    return perimeter(0, -140, 0, 360, 256, i, N);
  }
  if (si === 6) {      // anel helicoidal girando em volta do carrossel
    const a = (i / N) * Math.PI * 2 + lt * 0.6, R = 680 + 30 * Math.sin(i * 0.37);
    return [Math.cos(a) * R, -170 + Math.sin(a * 3 + lt * 2) * 60 + ((i % 5) - 2) * 14, Math.sin(a) * R];
  }
  if (si === 7) {      // rede neural: partículas correndo pelas conexões entre os nós
    const e = EDGES[i % EDGES.length], A = NODES[e[0]], B = NODES[e[1]], u = (p.r + lt * (0.25 + p.d * 0.5)) % 1;
    return [lerp(A[0], B[0], u), lerp(A[1], B[1], u), lerp(A[2], B[2], u)];
  }
  if (si === 8) {      // candles 3D: corpo e pavio de cada vela
    const c = CANDLES[i % CANDLES.length], k = Math.floor(i / CANDLES.length) / (N / CANDLES.length), grow = eOut((lt - c.j * 0.05) / 0.8);
    const lo = Math.min(c.o, c.c), hi = Math.max(c.o, c.c), body = k < 0.75;
    const y = body ? lerp(lo, hi, (k / 0.75)) : lerp(c.l, c.h, (k - 0.75) / 0.25);
    return [c.x + (body ? ((i % 3) - 1) * 9 : 0), lerp(-240, y, grow), body ? ((i % 2) - 0.5) * 18 : 0];
  }
  return TXTJ[i];      // JARVIS montado pelos estilhaços
}
function drawParticles(si, lt, lvl, accent, fadeMul = 1) {
  // morphing: cada partícula sai da forma da cena anterior para a atual, com atraso individual e redemoinho
  const prev = prevS(si), prevDur = si ? sceneEnd(prev) - sceneBegin(prev) + (CUT[prev] || 0) : 0;
  const win = si === FIN ? 1.5 : 1.0;
  const pts = [];
  for (let i = 0; i < N; i++) {
    const p = P[i];
    let q = shapeAt(si, i, lt + (CUT[si] || 0), lvl);
    const m = si ? eIO((lt - p.d * 0.35) / win) : 1;
    if (m < 1) {
      const a = shapeAt(prev, i, prevDur, 0);
      const sw = Math.sin(m * Math.PI) * (si === FIN ? 900 : 260) * p.r;
      const from = si === FIN ? [a[0] * 3, a[1] * 3, -900 + p.r * 400] : a;
      q = [lerp(from[0], q[0], m) + Math.cos(p.sw) * sw, lerp(from[1], q[1], m) + Math.sin(p.sw) * sw, lerp(from[2], q[2], m) + Math.sin(p.sw * 2) * sw * 0.5];
    }
    const s = project(q[0], q[1], q[2]); if (s) pts.push(s);
  }
  pts.sort((a, b) => b[2] - a[2]);
  g.save(); g.translate(CX, CY); g.globalCompositeOperation = 'lighter';
  for (const [x, y, z, k] of pts) {
    const coc = Math.abs(z - cam.focus) / cam.focus;               // profundidade de campo
    const r = clamp(2.2 * k * 1.15 + coc * 9, 0.8, 16), a = clamp(0.85 / (1 + coc * 4) * (0.6 + lvl * 0.6), 0.05, 0.95) * fadeMul;
    g.fillStyle = `rgba(${accent},${a})`; g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
  }
  g.restore();
}

/* ---------- núcleo de energia (laços de plasma) ---------- */
const LOOPS = Array.from({ length: 8 }, (_, i) => ({ seed: i * 1.37, speed: 0.25 + (i % 4) * 0.09, amp: 0.05 + (i % 3) * 0.025, k: 2 + (i % 5) }));
const noise = (x, s) => Math.sin(x * 1.7 + s) * 0.5 + Math.sin(x * 3.1 - s * 1.3) * 0.3 + Math.sin(x * 5.3 + s * 0.7) * 0.2;
function core(T, lvl, open, alpha = 1) {
  const c = project(0, 0, 0); if (!c) return;
  const R = 330 * c[3] * open;
  g.save(); g.translate(CX + c[0], CY + c[1]); g.globalAlpha = alpha; g.globalCompositeOperation = 'lighter';
  LOOPS.forEach((L, li) => {

  const bassNote = (t, f) => { const o = ctx.createOscillator(), lp = ctx.createBiquadFilter(), gn = ctx.createGain(); o.type = 'sawtooth'; o.frequency.value = f / 2; lp.type = 'lowpass'; lp.frequency.value = 320; env(gn, t, 0.01, 0.35, BEAT * 0.8); o.connect(lp); lp.connect(gn); gn.connect(musicBus); o.start(t); o.stop(t + BEAT); };
  const grid = (from, to, fn) => { for (let t = from, k = 0; t < to - 0.01; t += BEAT, k++) fn(t, k); };
  const chordAt = (t) => chords[Math.floor((t - 0.3) / (BAR * 2)) % 4];
  // build: kick em semínimas + hat (cena 2) · baixo (cena 3) · caixa acelerando + filtro (cena 4)
  grid(S(1), S(4), (t, k) => { kick(t, 0.8); hat(t + BEAT / 2); });
  grid(S(2), S(4), (t) => bassNote(t, chordAt(t)[0]));
  if (!SKIP.has(3)) for (let t = S(3), n = 0; t < S(3, 5.7); n++) { const step = n < 16 ? BEAT / 2 : BEAT / 4; snare(t, 0.08 + 0.18 * ((t - S(3)) / 5.7)); t += step; }
  if (!SKIP.has(3)) silence(S(3, 5.73), 0.3);                         // 300 ms de silêncio antes de "eu não invento números"
  // drop sob a voz (cena 5)
  grid(S(4), S(5), (t, k) => { kick(t, 0.95); hat(t + BEAT / 2, 0.1); bassNote(t, chordAt(t)[0]); if (k % 2) snare(t, 0.22); });
  // breakdown: só pad e pulso (cena 6)

    chordAt(t).concat([chordAt(t)[0] * 2]).forEach((f, j) => osc(musicBus, t + j * BEAT / 4, f * 2, BEAT / 5, { type: 'square', vol: 0.025, pan: j % 2 ? 0.4 : -0.4 })); });
  // conversa (cena 8): meio-tempo, mais espaço para a voz
  grid(S(7), S(8), (t, k) => { if (k % 4 === 0) kick(t, 0.8); if (k % 4 === 2) snare(t, 0.16); hat(t + BEAT / 2, 0.05); if (k % 2 === 0) bassNote(t, chordAt(t)[0]); });
  // mercado (cena 9): pulso volta inteiro, com filtro abrindo
  grid(S(8), S(9) - 0.2, (t, k) => { kick(t, 0.9); hat(t + BEAT / 2, 0.09); bassNote(t, chordAt(t)[0]); if (k % 2) snare(t, 0.2); osc(musicBus, t + BEAT / 2, chordAt(t)[2] * 4, 0.12, { type: 'triangle', vol: 0.03 }); });
  const hit = S(FIN, 1.05);
  kick(hit, 1.2); [73.42, 146.83, 220.0, 293.66].forEach((f) => osc(musicBus, hit, f, 2.6, { type: 'triangle', vol: 0.18 }));
  musicBus.gain.setTargetAtTime(0.0001, total - 1.6, 0.4);

  /* --- efeitos sonoros no mapa de áudio --- */
  const whoosh = (t, dir = 1, low = false) => nz(sfxBus, t - 0.35, 0.7, { f1: low ? 1800 : 3500, f2: low ? 160 : 300, q: 1.3, vol: 0.4, p1: -0.9 * dir, p2: 0.9 * dir, a: 0.3 });
  const impact = (t, v = 0.6) => { osc(sfxBus, t, 70, 0.7, { vol: v, f2: 32, a: 0.002 }); nz(sfxBus, t, 0.25, { f1: 900, f2: 150, q: 0.7, vol: v * 0.6, a: 0.001 }); };
  const glass = (t, f = 2600, v = 0.07, pan = 0) => { osc(sfxBus, t, f, 0.5, { vol: v, pan }); osc(sfxBus, t, f * 2.76, 0.25, { vol: v * 0.4, pan }); };
  const click = (t, v = 0.18) => { osc(sfxBus, t, 1900, 0.03, { type: 'square', vol: v * 0.3 }); nz(sfxBus, t, 0.03, { f1: 4000, f2: 3500, q: 3, vol: v, a: 0.001 }); };
  // cena 1
  osc(sfxBus, 0.3, 55, 0.6, { vol: 0.55, f2: 40, a: 0.003 });                                  // ping sub-grave
  nz(sfxBus, 1.0, 2.0, { f1: 200, f2: 6500, q: 2, vol: 0.22, a: 1.6 });                        // riser
  osc(musicBus, 1.0, 98, 2.0, { type: 'triangle', vol: 0.12, f2: 392 });
  glass(2.4, 1800, 0.12); glass(2.48, 2400, 0.1);                                              // anéis travam
  nz(sfxBus, OT.l1, 0.55, { f1: 1200, f2: 6000, q: 4, vol: 0.12, p1: -0.6, p2: 0.6, a: 0.02 });            // scanner da 1ª linha
  [OT.w1, OT.w2].forEach((t, w) => { nz(sfxBus, t - 0.05, 0.25, { f1: 4000, f2: 900, q: 1.4, vol: 0.2, p1: w ? 0.5 : -0.5, p2: 0, a: 0.04 });
    for (let j = 0; j < (w ? 7 : 10); j++) glass(t + j * 0.025, 2600 + (j % 4) * 180, 0.03, (w ? 0.2 : -0.6) + j * 0.05); });   // palavras girando, tique por letra
  nz(sfxBus, OT.com - 0.05, 0.2, { f1: 2500, f2: 700, q: 1.5, vol: 0.12, p1: -0.8, p2: 0, a: 0.03 });                 // "COM" desliza
  impact(OT.ia, 0.75); osc(sfxBus, OT.ia, 49, 1.1, { vol: 0.5, f2: 36, a: 0.003 });                                   // "IA" bate: grave cinematográfico
  osc(sfxBus, 2.5, 1568, 0.9, { vol: 0.06 }); osc(sfxBus, 2.56, 2349, 0.9, { vol: 0.05 });     // shimmer no "IA"
  // atravessar entre cenas
  for (const i of SHOWN) { if (!i) continue; whoosh(sceneBegin(i), i % 2 ? 1 : -1, i === 1 || i === FIN); impact(sceneBegin(i) + 0.05, i === FIN ? 0 : i === 6 ? 0.7 : 0.28); }
  // cena 2: deformação da onda em texto + teclas + blip
  osc(sfxBus, S(1, 2.5), 300, 1.0, { type: 'sawtooth', vol: 0.05, f2: 900 });
  for (let j = 0; j < 22; j++) click(S(1, 2.6 + j * 0.045), 0.07);
  osc(sfxBus, S(1, 5.0), 1320, 0.12, { vol: 0.14 }); osc(sfxBus, S(1, 5.08), 1760, 0.18, { vol: 0.12 });
  // cena 3: chips com pop
  [3.1, 4.5, 5.9].forEach((d, j) => { click(S(2, d), 0.2); osc(sfxBus, S(2, d + 0.02), 880 + j * 220, 0.14, { vol: 0.12, pan: -0.4 + j * 0.4 }); });
  // cena 4: placar + contadores + impacto com clang + granular
  if (!SKIP.has(3)) { for (let j = 0; j < 3; j++) { click(S(3, 0.8 + j * 0.35), 0.25); for (let k = 0; k < 10; k++) click(S(3, 0.85 + j * 0.35 + k * 0.1), 0.05); }
  impact(S(3, 6.0), 0.7); osc(sfxBus, S(3, 6.0), 523, 1.2, { type: 'square', vol: 0.05, f2: 498 }); glass(S(3, 6.02), 3100, 0.1);
  for (let k = 0; k < 40; k++) glass(S(3, 7.2 + k * 0.012), 1500 + Math.random() * 4000, 0.012, Math.random() * 2 - 1); }
  // cena 5: acordes das etapas + glitch da nuvem
  [[0.8, 523.25], [2.4, 659.25], [4.0, 783.99]].forEach(([d, f]) => osc(sfxBus, S(4, d), f, 0.45, { vol: 0.12 }));
  for (let k = 0; k < 6; k++) nz(sfxBus, S(4, 5.3 + k * 0.03), 0.02, { f1: 2000 + k * 800, f2: 600, q: 4, vol: 0.12, a: 0.001 });
  // cena 6: clique físico + ding + catraca
  click(S(5, 2.6), 0.35); osc(sfxBus, S(5, 2.6), 160, 0.08, { type: 'square', vol: 0.1 });
  osc(sfxBus, S(5, 2.7), 1046.5, 0.5, { vol: 0.13 }); osc(sfxBus, S(5, 2.82), 1568, 0.7, { vol: 0.11 });
  for (let k = 0; k < 6; k++) click(S(5, 2.9 + k * 0.05), 0.15);
  // cena 7: riser curto + impacto cinematográfico + vidro encaixando + shimmer + power down
  nz(sfxBus, S(FIN, -0.2), 0.9, { f1: 300, f2: 7000, q: 2, vol: 0.2, a: 0.8 });
  impact(hit, 0.95); for (let k = 0; k < 18; k++) glass(hit + 0.02 + k * 0.018, 2200 + Math.random() * 3000, 0.03, Math.random() * 2 - 1);
  [1568, 2093, 2637, 3136].forEach((f, j) => osc(sfxBus, S(FIN, 2.25 + j * 0.07), f, 1.0, { vol: 0.05 }));
  osc(sfxBus, total - 1.0, 440, 0.9, { type: 'triangle', vol: 0.12, f2: 110 });
  // HUD: bipes de mira travando no alvo
  const lock = (t, f = 2400) => { osc(sfxBus, t, f, 0.05, { type: 'square', vol: 0.035 }); osc(sfxBus, t + 0.09, f * 1.5, 0.08, { type: 'square', vol: 0.035 }); };
  // cena 7: cada cartão do carrossel encaixa (whoosh curto + clique + nota)
  ACTS.forEach((a, j) => { const t = sceneBegin(6) + kw(6, a[3]); if (j) nz(sfxBus, t - 0.3, 0.3, { f1: 2500, f2: 500, q: 1.5, vol: 0.18, a: 0.15 }); click(t, 0.22); osc(sfxBus, t + 0.02, 659.25 * Math.pow(2, j / 6), 0.25, { vol: 0.09 }); });
  impact(sceneBegin(6) + kw(6, 'Tudo'), 0.5);
  // cena 8: mensagens entrando (pop duplo), digitação da resposta
  [kw(7, 'Me conte'), kw(7, 'comparo')].forEach((d, j) => { const t = sceneBegin(7) + d; osc(sfxBus, t, j ? 880 : 660, 0.08, { vol: 0.12 }); osc(sfxBus, t + 0.07, j ? 1320 : 990, 0.12, { vol: 0.1 }); });
  for (let k = 0; k < 26; k++) click(sceneBegin(7) + kw(7, 'comparo') + 0.2 + k * 0.06, 0.05);
  osc(sfxBus, sceneBegin(7) + kw(7, 'sugiro') + 0.2, 1046.5, 0.3, { vol: 0.1 });
  // cena 9: etiquetas da análise e selo da decisão
  ['analiso', 'riscos', 'decisão'].forEach((w, j) => { const t = sceneBegin(8) + kw(8, w); click(t, 0.2); osc(sfxBus, t, [784, 622, 988][j], 0.2, { vol: 0.1 }); });
  impact(sceneBegin(8) + kw(8, 'decisão'), 0.35);
  lock(S(1, 3.6 - GAP / 2) + 0.3); lock(S(5, 2.2 - GAP / 2) + 0.3, 1800);
}

/* ---------- loudness (BS.1770) e limitador ---------- */
function biquad(x, b, a) { const y = new Float32Array(x.length); let x1 = 0, x2 = 0, y1 = 0, y2 = 0; for (let i = 0; i < x.length; i++) { const x0 = x[i], y0 = b[0] * x0 + b[1] * x1 + b[2] * x2 - a[1] * y1 - a[2] * y2; x2 = x1; x1 = x0; y2 = y1; y1 = y0; y[i] = y0; } return y; }
function lufs(chs, fs) {
  const f0 = 1681.974450955533, G = 3.999843853973347, Q = 0.7071752369554196, K = Math.tan(Math.PI * f0 / fs), Vh = 10 ** (G / 20), Vb = Vh ** 0.4996667741545416, a0 = 1 + K / Q + K * K;
  const b1 = [(Vh + Vb * K / Q + K * K) / a0, 2 * (K * K - Vh) / a0, (Vh - Vb * K / Q + K * K) / a0], a1 = [1, 2 * (K * K - 1) / a0, (1 - K / Q + K * K) / a0];
  const f1 = 38.13547087602444, Q1 = 0.5003270373238773, K1 = Math.tan(Math.PI * f1 / fs), a02 = 1 + K1 / Q1 + K1 * K1, b2 = [1, -2, 1], a2 = [1, 2 * (K1 * K1 - 1) / a02, (1 - K1 / Q1 + K1 * K1) / a02];
  const ks = chs.map((c) => biquad(biquad(c, b1, a1), b2, a2)), blk = Math.floor(fs * 0.4), hop = Math.floor(fs * 0.1), ms = [];
  for (let i = 0; i + blk <= ks[0].length; i += hop) { let e = 0; for (const k of ks) for (let j = i; j < i + blk; j++) e += k[j] * k[j]; ms.push(e / blk); }
  const L = (m) => -0.691 + 10 * Math.log10(Math.max(m, 1e-12)), abs = ms.filter((m) => L(m) > -70);
  const rel = L(abs.reduce((a, b) => a + b, 0) / abs.length) - 10, gated = abs.filter((m) => L(m) > rel);
  return L(gated.reduce((a, b) => a + b, 0) / gated.length);
}
function masterMix(buf) {
  const chs = [buf.getChannelData(0), buf.getChannelData(1)], before = lufs(chs, buf.sampleRate);
  const gain = 10 ** ((-14 - before) / 20), ceil = 10 ** (-1.2 / 20), look = Math.floor(buf.sampleRate * 0.004), rel = Math.exp(-1 / (buf.sampleRate * 0.08));
  for (const c of chs) for (let i = 0; i < c.length; i++) c[i] *= gain;
  // limitador com antecipação (ligado entre os canais)
  const n = chs[0].length, peak = new Float32Array(n);
  for (let i = 0; i < n; i++) peak[i] = Math.max(Math.abs(chs[0][i]), Math.abs(chs[1][i]));
  let envG = 1;
  for (let i = 0; i < n; i++) {
    let p = 0; for (let j = i; j < Math.min(n, i + look); j += 4) p = Math.max(p, peak[j]);
    const need = p > ceil ? ceil / p : 1; envG = need < envG ? need : Math.min(1, need * (1 - rel) + envG * rel);
    chs[0][i] *= envG; chs[1][i] *= envG;
  }
  return { before, after: lufs(chs, buf.sampleRate) };
}

/* ---------- carregar, mixar, prévia e exportação ---------- */
async function load() {
  st('Carregando fontes…');
  await Promise.all(['300 96px Sora', '600 96px Sora', '800 236px Sora', '800 34px "JetBrains Mono"', '700 46px "JetBrains Mono"'].map((f) => document.fonts.load(f)));
  await document.fonts.ready;
  const A = new AudioContext({ sampleRate: SR });
  buffers = [];
  for (let i = 0; i < SCENES.length; i++) { const r = await fetch(`/video/audio-curta/cena-${i + 1}.wav?v=${Date.now()}`); if (!r.ok) throw new Error(`falta a narração da cena ${i + 1}`); buffers.push(await A.decodeAudioData(await r.arrayBuffer())); }
  A.close();
  let t = 0.3; starts = []; buffers.forEach((b, i) => { starts.push(t); if (!SKIP.has(i)) t += b.duration + GAP; });
  total = t + TAIL;
  try { market = ((await (await fetch('/api/live')).json()).market || []).filter((q) => ['Brent', 'WTI', 'PETR4', 'VALE3', 'Dólar', 'Bitcoin', 'Ethereum', 'Solana'].includes(q.n)); } catch { market = []; }
  const btc = market.find((q) => q.n === 'Bitcoin'), sp = btc?.spark?.length > 8 ? btc.spark : Array.from({ length: 25 }, (_, k) => 100 + Math.sin(k * 0.7) * 6 + k * 0.8);
  { const n = 18, pts = Array.from({ length: n + 1 }, (_, k) => sp[Math.floor(k / n * (sp.length - 1))]), mn = Math.min(...pts), mx = Math.max(...pts), Y = (v) => -60 - (v - mn) / (mx - mn || 1) * 360;
    CANDLES = pts.slice(1).map((v, j) => { const o = pts[j], c = v, wick = Math.abs(c - o) * 0.6 + (mx - mn) * 0.04; return { j, x: lerp(-420, 420, j / (n - 1)), o: Y(o), c: Y(c), h: Y(Math.max(o, c) + wick), l: Y(Math.min(o, c) - wick) }; }); }
  TXT1 = textPoints('Jarvis, como está\no mercado?', 120, 1300, 0, 800).map(([x, y]) => [x * 0.78, y * 0.78, 0]);
  TXTJ = textPoints('JARVIS', 300, 1350, 0, 900).map(([x, y]) => [x * 0.72, y * 0.72 - 40, 0]);
  st('Mixando trilha, efeitos e locução…');
  const off = new OfflineAudioContext(2, Math.ceil(total * SR), SR);
  buildAudio(off);
  MIX = await off.startRendering();
  const m = masterMix(MIX);
  const L = MIX.getChannelData(0), per = Math.floor(SR / FPS), frames = Math.ceil(total * FPS); ENV = new Float32Array(frames);
  for (let f = 0; f < frames; f++) { let e = 0; const a = f * per; for (let j = a; j < Math.min(L.length, a + per); j++) e += L[j] * L[j]; ENV[f] = clamp(Math.sqrt(e / per) * 2.6); }
  st(`Pronto: ${total.toFixed(1)} s · trilha 104 BPM · mix ${m.before.toFixed(1)} → ${m.after.toFixed(1)} LUFS.\nEXPORTAR renderiza quadro a quadro (30 fps).`);
}
const lvlAt = (T) => ENV ? ENV[clamp(Math.floor(T * FPS), 0, ENV.length - 1)] : 0;

async function preview() {
  if (!MIX) await load();
  const A = new AudioContext({ sampleRate: SR }); const s = A.createBufferSource(); s.buffer = MIX; s.connect(A.destination);
  const t0 = A.currentTime + 0.1; s.start(t0);
  const tick = () => { const T = A.currentTime - t0; frame(Math.max(0, T), lvlAt(T)); if (T < total) requestAnimationFrame(tick); else { A.close(); st('Prévia concluída.'); } };
  tick();
}

async function exportVideo() {
  if (!MIX) await load();
  if (!window.VideoEncoder || !window.AudioEncoder || !window.Mp4Muxer) return st('Sem WebCodecs/muxer neste navegador.');
  const frames = Math.ceil(total * FPS);
  const muxer = new Mp4Muxer.Muxer({ target: new Mp4Muxer.ArrayBufferTarget(), fastStart: 'in-memory', video: { codec: 'avc', width: W, height: H, frameRate: FPS }, audio: { codec: 'aac', sampleRate: SR, numberOfChannels: 2 } });
  const venc = new VideoEncoder({ output: (c, m) => muxer.addVideoChunk(c, m), error: (e) => st('Erro no vídeo: ' + e.message) });
  venc.configure({ codec: 'avc1.640028', width: W, height: H, bitrate: 10_000_000, framerate: FPS, latencyMode: 'quality' });
  const aenc = new AudioEncoder({ output: (c, m) => muxer.addAudioChunk(c, m), error: (e) => st('Erro no áudio: ' + e.message) });
  aenc.configure({ codec: 'mp4a.40.2', sampleRate: SR, numberOfChannels: 2, bitrate: 192_000 });
  const L = MIX.getChannelData(0), R = MIX.getChannelData(1);
  for (let i = 0; i < MIX.length; i += 1024) {
    const n = Math.min(1024, MIX.length - i), planar = new Float32Array(n * 2); planar.set(L.subarray(i, i + n), 0); planar.set(R.subarray(i, i + n), n);
    const ad = new AudioData({ format: 'f32-planar', sampleRate: SR, numberOfFrames: n, numberOfChannels: 2, timestamp: Math.round(i / SR * 1e6), data: planar }); aenc.encode(ad); ad.close();
  }
  const t0 = performance.now();
  for (let f = 0; f < frames; f++) {
    frame(f / FPS, ENV[f]);
    const vf = new VideoFrame(C, { timestamp: Math.round(f * 1e6 / FPS), duration: Math.round(1e6 / FPS) });
    venc.encode(vf, { keyFrame: f % (FPS * 2) === 0 }); vf.close();
    if (venc.encodeQueueSize > 8) await new Promise((r) => setTimeout(r, 5));
    if (f % 15 === 0) { st(`Renderizando quadro ${f}/${frames} (${Math.round(f / frames * 100)}%)…`); await new Promise((r) => setTimeout(r, 0)); }
  }
  await venc.flush(); await aenc.flush(); muxer.finalize();
  const blob = new Blob([muxer.target.buffer], { type: 'video/mp4' });
  st(`Salvando ${(blob.size / 1048576).toFixed(1)} MB… (render em ${((performance.now() - t0) / 1000).toFixed(0)} s)`);
  const r = await fetch('/api/video/save?nome=jarvis-plano-sequencia', { method: 'POST', headers: { 'Content-Type': 'video/mp4' }, body: blob }).then((x) => x.json());
  window.__saved = r;
  st(r.ok ? `✓ Vídeo salvo: ${r.file} (${r.mb} MB · ${frames} quadros a ${FPS} fps)` : 'Falhou ao salvar.');
}
document.getElementById('exp').onclick = () => exportVideo();
document.getElementById('prev').onclick = () => preview();
document.getElementById('scrub').oninput = (e) => { if (total) { const T = e.target.value / 1000 * total; frame(T, lvlAt(T)); st(`Quadro em ${T.toFixed(2)} s`); } };
load().then(() => frame(total * 0.06, 0)).catch((e) => st('Aguardando: ' + e.message));
window.__frame = (T) => frame(T, lvlAt(T));
</script>
